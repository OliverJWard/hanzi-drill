<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Hanzi Drill · HSK</title>
<style>
:root{
  --bg:#f7f6f2;--card:#fff;--ink:#1d1c1a;--mute:#74726c;--line:#e5e3dc;--chip:#efede6;
  --acc:#b8322a;--accink:#fff;--ok:#2b8a3e;--warn:#d9730d;--bad:#c92a2a;
  --t1:#e03131;--t2:#2f9e44;--t3:#1c7ed6;--t4:#7048e8;--t5:#868e96;
  --s-new:#ced4da;--s-learn:#f59f00;--s-rev:#4dabf7;--s-known:#40c057;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141413;--card:#1e1e1c;--ink:#edece7;--mute:#9b988f;--line:#2f2e2a;--chip:#2a2926;
  --acc:#e5675d;--accink:#1a0a08;--ok:#51cf66;--warn:#ffa94d;--bad:#ff6b6b;
  --t1:#ff6b6b;--t2:#51cf66;--t3:#74c0fc;--t4:#b197fc;--t5:#adb5bd;
  --s-new:#495057;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.hz,[lang="zh-Hans"]{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","Noto Sans SC","WenQuanYi Micro Hei",sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 16px 64px}
h1{margin:0;font-size:22px}
.mute{color:var(--mute)}.sm{font-size:13px}.c{text-align:center}
.hd{display:flex;gap:14px;align-items:center;margin:4px 0 8px}
.logo{font-size:44px;line-height:1;color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card.center{text-align:center}
.card.tap{cursor:pointer;padding:28px 16px}
.lbl{font-size:13px;color:var(--mute);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.lbl:first-child{margin-top:0}
.lbl b{color:var(--ink);text-transform:none;letter-spacing:0}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:12px;cursor:pointer}
.btn.pri{background:var(--acc);color:var(--accink);border-color:transparent;font-weight:600}
.btn.ghost{background:transparent}
.btn.block{display:block;width:100%;margin-top:10px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible,.lvc:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
input[type=checkbox]{width:auto}
.seg{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:8px 6px;border-radius:9px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font:inherit;font-size:14px;border:0;background:var(--chip);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accink)}
.chip.hz{font-size:22px;padding:4px 14px}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.lvc{font:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:12px;cursor:pointer}
.lvc small{color:var(--mute);font-size:12px}
.lvc.on{background:var(--acc);border-color:transparent;color:var(--accink)}
.lvc.on small{color:inherit;opacity:.85}
.lv{display:inline-block;font-size:11px;font-weight:600;line-height:1;color:var(--mute);background:var(--chip);border-radius:6px;padding:3px 6px;vertical-align:middle;white-space:nowrap}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--chip);margin-top:16px}
.bar i{display:block}
.s-new{background:var(--s-new)}.s-learn{background:var(--s-learn)}.s-rev{background:var(--s-rev)}.s-known{background:var(--s-known)}
.legend{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13px;color:var(--mute);margin:8px 0 4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row2{display:flex;justify-content:space-around;text-align:center}
.row2 b{font-size:20px}
.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.warn .btn{margin-top:8px;padding:6px 12px}
.filebar{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;color:var(--mute);margin:2px 2px 8px}
.filebar a{color:var(--acc);cursor:pointer;text-decoration:underline}
.filebox{background:var(--chip);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:14px}
details summary{cursor:pointer;font-weight:600}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}
.chk{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:15px}
.chk input{margin-top:4px}
.top{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.top input[type=search]{flex:1;min-width:0}
.prog{flex:1;height:8px;border-radius:5px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .2s}
.big{font-size:min(34vw,140px);line-height:1.15;text-align:center}
.big.w{font-size:min(20vw,84px)}
.py{font-size:26px;text-align:center;margin:4px 0}
.mean{font-size:18px;text-align:center}
.sep{color:var(--mute)}
.t1{color:var(--t1)}.t2{color:var(--t2)}.t3{color:var(--t3)}.t4{color:var(--t4)}.t5{color:var(--t5)}
.nocolor .t1,.nocolor .t2,.nocolor .t3,.nocolor .t4,.nocolor .t5{color:inherit}
.det h4{margin:18px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.words .wrow{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"h p i" "h m i";gap:0 14px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wh{grid-area:h;font-size:26px;min-width:56px}
.wp{grid-area:p;font-size:17px}
.wm{grid-area:m;color:var(--mute);font-size:14px}
.wrow .ico{grid-area:i}
.ico{border:0;background:transparent;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:8px}
.in{color:inherit;text-decoration:none}
a.in{cursor:pointer;border-bottom:2px solid color-mix(in srgb,var(--acc) 45%,transparent)}
.out{color:var(--mute);opacity:.65}
.parts{display:grid;gap:6px}
.part{display:grid;grid-template-columns:48px 90px 1fr;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.ph{font-size:30px;text-align:center}
.pm{color:var(--mute);font-size:14px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.rate .btn{display:flex;flex-direction:column;align-items:center;padding:10px 2px;border-bottom:3px solid var(--line)}
.rate small{color:var(--mute);min-height:1.2em}
.r0{border-bottom-color:var(--bad)!important}.r1{border-bottom-color:var(--warn)!important}.r2{border-bottom-color:var(--ok)!important}.r3{border-bottom-color:var(--t3)!important}
.ansrow{display:flex;gap:8px;margin-top:12px}
.ansrow input{flex:1;min-width:0;font-size:20px}
.hint{font-size:13px;color:var(--mute);margin:8px 2px}
.hint a{color:var(--acc);cursor:pointer;text-decoration:underline}
.ver{border-radius:12px;padding:10px 14px;margin:10px 0;border:1px solid var(--line)}
.ver.ok{border-color:var(--ok);color:var(--ok)}.ver.warn{border-color:var(--warn);color:var(--warn)}.ver.bad{border-color:var(--bad);color:var(--bad)}
.ver div{color:var(--ink);font-size:15px}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{font:inherit;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:14px;border-radius:12px;cursor:pointer;font-size:18px}
.opt:disabled{opacity:1;cursor:default}
.opt.ok{border-color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.opt.bad{border-color:var(--bad);box-shadow:inset 0 0 0 2px var(--bad)}
.ochz{font-size:30px}
kbd{font:inherit;font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:6px}
.brow{display:grid;grid-template-columns:34px 52px 1fr 14px;gap:8px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 2px;cursor:pointer}
.rk{color:var(--mute);font-size:12px;text-align:right}
.bh{font-size:30px;text-align:center}
.bm{display:flex;flex-direction:column;font-size:14px;min-width:0}
.bm .mute{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{padding:18px;max-height:86vh;overflow:auto}
.stat{margin-top:14px;font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:99;font-size:14px;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<!-- Word lists, one file per HSK level, generated by build.py from data/N.json.
     Plain <script> tags so they also load when this page is opened as a local
     file. A missing file is skipped; HSK 1 is also built in below. -->
<script src="hsk1.js"></script>
<script src="hsk2.js"></script>
<script src="hsk3.js"></script>
<script src="hsk4.js"></script>
<script src="hsk5.js"></script>
<script src="hsk6.js"></script>
<script src="hsk7.js"></script>
<script>
/* ============================================================
   HANZI DRILL · HSK 3.0 — fully offline.

   WORD LISTS come from the HSK JSON files of
   github.com/drkameleon/complete-hsk-vocabulary (MIT), "new" HSK 3.0
   lists 1.json … 7.json (level 7 = HSK 7–9), kept in data/. These are
   cumulative (2.json also contains every HSK 1 word); a word counts at
   the lowest level it appears in. build.py converts them to compact lines
   hanzi|pinyin|meaning  and writes hsk1.js … hsk7.js (window.HSK_WORDS),
   loaded above. HSK 1 is also embedded below (BUILTIN_LISTS) so this page
   works on its own. Lists imported from Settings override both; the level
   is read from the file name (3.json = HSK 3).

   A character's HSK level = lowest level of any word containing it.
   Example words for a character = multi-character words whose characters
   are ALL at that character's level or lower.
   CHARS_RAW only supplies meanings for characters that are never a
   standalone word in the lists.
   ============================================================ */
/* HSK JSON (drkameleon/complete-hsk-vocabulary) -> compact "hanzi|pinyin|meaning" lines */
const HSKCONV=(function(){
  const MK={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù',v:'ǖǘǚǜ'};
  function mark(s){
    const m=/^([a-z]+?)([1-5])?$/.exec(s);if(!m)return s;
    const b=m[1],t=m[2]?+m[2]:5;
    if(t===5)return b.replace(/v/g,'ü');
    let i=b.search(/[ae]/);
    if(i<0&&b.includes('ou'))i=b.indexOf('o');
    if(i<0)for(let k=b.length-1;k>=0;k--)if('iouv'.includes(b[k])){i=k;break;}
    if(i<0)return b;
    return(b.slice(0,i)+MK[b[i]][t-1]+b.slice(i+1)).replace(/v/g,'ü');
  }
  const markPy=p=>p.split(' ').map(mark).join(' ');
  const normPy=p=>String(p).replace(/ü|u:/g,'v').replace(/\s+/g,' ').trim();
  const JUNK=/^(surname |variant of|old variant|also pr|see |abbr\. for|erhua variant|japanese variant)|\(archaic\)|archaic variant|unofficial variant|\(onom\.\)|\(dialect\)|abbr\. for|\(Tw\)|Taiwan pr\./i;
  const clean=m=>String(m).replace(/\|/g,'/').replace(/\s+/g,' ').trim();
  function toLine(e){
    const hz=e.simplified,pos=(e.pos||[]).join('');
    const particle=/[yu]/.test(pos);
    let forms=(e.forms||[]).map((f,i)=>{
      const raw=f.transcriptions&&f.transcriptions.numeric||'';
      const ms=(f.meanings||[]).map(clean).filter(Boolean),good=ms.filter(m=>!JUNK.test(m));
      const cap=/^[A-Z]/.test(raw);
      const last=normPy(raw).split(' ').pop(),neutral=/5$|[a-z]$/.test(last);
      return{py:normPy(raw).toLowerCase(),ms:good.length?good:ms,minor:!good.length||cap,score:good.length+(particle&&neutral?.5:0),i};
    }).filter(f=>f.py);
    if(!forms.length)return null;
    const major=forms.filter(f=>!f.minor);if(major.length)forms=major;
    forms.sort((a,b)=>b.score-a.score||a.i-b.i);
    const seen=new Set(),use=[];
    for(const f of forms){if(seen.has(f.py))continue;seen.add(f.py);use.push(f);}
    const multi=use.length>1;
    let parts=[];
    for(const f of use.slice(0,3)){
      let t=f.ms.slice(0,2).join('; ');
      if(!t)continue;
      parts.push(multi?`(${markPy(f.py)}) ${t}`:t);
    }
    let mean=parts.join(' · ');
    if(mean.length>150)mean=mean.slice(0,150).replace(/[;·(\s]+[^;·]*$/,'')||mean.slice(0,150);
    return hz+'|'+use.map(f=>f.py).join('/')+'|'+mean;
  }
  function levelFromName(name){const m=/(\d+)(?:\.min)?\.json$/i.exec(name||'');return m?+m[1]:0;}
  function levelsFromTags(e){
    const t=(e.level||[]).map(String).filter(s=>/^new-\d+$/.test(s)).map(s=>+s.slice(4));
    return t.length?Math.min(...t):0;
  }
  /* returns {level:[entries]} or null if the level cannot be worked out */
  function group(arr,name){
    if(!Array.isArray(arr))return null;
    const lv=levelFromName(name);
    if(lv)return{[lv]:arr};
    const out={};let ok=false;
    for(const e of arr){const l=levelsFromTags(e);if(l){(out[l]=out[l]||[]).push(e);ok=true;}}
    return ok?out:null;
  }
  const toText=entries=>entries.map(toLine).filter(Boolean).join('\n');
  return{group,toText,toLine,markPy};
})();

function speak(t){
  if(!('speechSynthesis' in window)){toast('Speech isn’t available in this browser');return;}
  const vs=speechSynthesis.getVoices(),v=vs.find(v=>/^zh[-_]?(CN|Hans)/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang));
  if(!v&&vs.length&&!warned){warned=true;toast('No Chinese voice is installed on this device');}
  const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;if(v)u.voice=v;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600);}

/* ---------- html builders ---------- */
/* lim: characters above this HSK level are greyed out */
const hzHTML=(w,link,lim)=>[...w].map(c=>{
  const e=IDX.get(c);if(!e)return`<span class="out">${esc(c)}</span>`;
  const cls='in'+(lim&&e.level>lim?' out':'');
  return link?`<a class="${cls}" data-act="open" data-k="c:${c}">${c}</a>`:`<span class="${cls}">${c}</span>`;
}).join('');
const spk=t=>'speechSynthesis' in window?`<button class="ico" data-act="speak" data-t="${esc(t)}" aria-label="Play sound">🔊</button>`:'';
function wordRow(w,link,lim){
  return`<div class="wrow"><div class="wh hz" lang="zh-Hans">${hzHTML(w.hz,link,lim)}</div><div class="wp">${pyHTML(w.py)} ${lvTag(w.level)}</div><div class="wm">${esc(w.gloss)}</div>${spk(w.hz)}</div>`;
}
function charDetail(e){
  const ws=e.words.slice(0,8),oth=ws.length<3?e.other.slice(0,3-ws.length):[];
  return`<div class="det"><div class="big hz" lang="zh-Hans">${e.hz}</div>
  <div class="py">${e.py.map(pyHTML).join('<span class="sep"> · </span>')} ${spk(e.hz)}</div>
  <div class="mean">${esc(e.mean)}</div>
  <div class="mute sm c">${lvTag(e.level)}</div>
  ${ws.length?`<h4>Example words · only HSK ${lvName(e.level)} or lower characters</h4><div class="words">${ws.map(w=>wordRow(w,true,e.level)).join('')}</div>`:''}
  ${oth.length?`<h4>${ws.length?'Also':'Only found'} in words with higher-level characters</h4><div class="words">${oth.map(w=>wordRow(w,true,e.level)).join('')}</div>`:''}
  ${!ws.length&&!oth.length?'<h4>Words</h4><p class="mute sm">No multi-character words in the list use this character.</p>':''}</div>`;
}
function wordDetail(w){
  const syl=w.py.trim().split(/\s+/);
  const parts=w.chars.map((c,i)=>{
    const e=IDX.get(c);
    return`<div class="part"><div class="hz ph" lang="zh-Hans">${e?`<a class="in" data-act="open" data-k="c:${c}">${c}</a>`:esc(c)}</div><div>${syl[i]?pyHTML(syl[i]):''}</div><div class="pm">${e?lvTag(e.level)+' '+esc(short(e.mean)):''}</div></div>`;
  }).join('');
  return`<div class="det"><div class="big hz w" lang="zh-Hans">${hzHTML(w.hz,false)}</div>
  <div class="py">${w.pys.map(pyHTML).join('<span class="sep"> · </span>')} ${spk(w.hz)}</div><div class="mean">${esc(w.gloss)}</div>
  <div class="mute sm c">${lvTag(w.level)}</div>
  <h4>Characters</h4><div class="parts">${parts}</div></div>`;
}
const detailHTML=it=>it.kind==='c'?charDetail(IDX.get(it.hz)):wordDetail(WIDX.get(it.hz));
const frontFwd=it=>`<div class="big hz ${it.kind==='w'?'w':''}" lang="zh-Hans">${it.kind==='w'?hzHTML(it.hz,false):it.hz}</div>`;
const meanOf=it=>it.kind==='c'?short(it.mean):it.mean;
const frontRev=it=>`<div class="py">${pyHTML(it.py[0])}</div><div class="mean">${esc(meanOf(it))}</div><div class="mute c" style="margin-top:8px">Which ${it.kind==='c'?'character':'word'}?</div>`;

/* ---------- session logic ---------- */
const cur=()=>sess.queue[sess.i];
function startSession(cram){
  const q=buildQueue(cram);if(!q.length)return;
  sess={queue:q.map(it=>({it})),i:0,cram,n:0,ok:0,missed:new Map(),input:''};
  prep();setView('session');
}
function prep(){const c=cur();c.phase='q';c.res=null;c.spoke=false;sess.input='';if(store.set.method==='choice')c.q=makeChoice(c.it);}
function makeChoice(it){
  let P=pool().filter(x=>x.key!==it.key);
  if(P.length<6)P=ITEMS[it.kind].filter(x=>x.key!==it.key);
  const t=store.set.dir==='rev'?'m2h':(Math.random()<.5?'h2m':'h2p');
  const txt=x=>t==='h2m'?meanOf(x):t==='h2p'?x.py[0]:x.hz;
  const correct=txt(it),seen=new Set(t==='h2p'?it.py:[correct]),opts=[];
  if(t==='h2p')for(const v of shuffle(toneVars(it.py[0]))){if(opts.length>=2)break;if(!seen.has(v)){opts.push(v);seen.add(v);}}
  for(const x of shuffle(P.slice())){if(opts.length>=3)break;const s=txt(x);if(!seen.has(s)){opts.push(s);seen.add(s);}}
  opts.push(correct);
  return{t,correct,opts:shuffle(opts)};
}
function applyGrade(q){
  const c=cur(),key=c.it.key;
  if(!c.retry){
    sess.n++;if(q>=2)sess.ok++;
    if(!sess.cram||q<2)grade(key,q);
    logAnswer(q>=2);save();
  }
  if(q===0){
    sess.missed.set(key,c.it);
    sess.queue.splice(Math.min(sess.queue.length,sess.i+4),0,{it:c.it,retry:true});
  }
}
function advance(){
  sess.i++;
  if(sess.i>=sess.queue.length){view='summary';save();render();}else{prep();render();}
  window.scrollTo(0,0);
}
function rate(q){const c=cur();if(!c||c.phase!=='a')return;applyGrade(q);advance();}
function choose(i){const c=cur();if(c.phase!=='q')return;c.pick=i;c.phase='a';applyGrade(c.q.opts[i]===c.q.correct?2:0);render();}
function check(){
  const c=cur(),a=$('#ans'),v=a?a.value.trim():'';if(!v||c.phase!=='q')return;
  sess.input=v;c.res=gradePinyin(v,c.it.py);c.phase='a';applyGrade(c.res==='ok'?2:0);render();
}
function giveUp(){const c=cur();if(c.phase!=='q')return;sess.input='';c.res='skip';c.phase='a';applyGrade(0);render();}

/* ---------- importing word lists ---------- */
async function importLists(files){
  if(!files.length)return;
  const add={},notes=[];
  for(const f of files){
    let txt='';try{txt=await f.text();}catch(e){notes.push(f.name+': unreadable');continue;}
    if(/^\s*[\[{]/.test(txt)){
      let arr;try{arr=JSON.parse(txt);}catch(e){notes.push(f.name+': not valid JSON');continue;}
      if(arr&&!Array.isArray(arr)&&Array.isArray(arr.words))arr=arr.words;
      let g=HSKCONV.group(arr,f.name);
      if(!g){
        const a=prompt('Which HSK level is “'+f.name+'”? (1–7; 7 = HSK 7–9)','');
        const n=+a;if(!(n>=1&&n<=9)||!Array.isArray(arr)){notes.push(f.name+': skipped (no level)');continue;}
        g={[n]:arr};
      }
      for(const lv in g){const s=HSKCONV.toText(g[lv]);if(s){add[lv]=s;notes.push('HSK '+lvName(+lv)+': '+s.split('\n').length+' words');}}
    }else{
      const p=parseWordText(txt),by={};
      p.rows.forEach(w=>{(by[w.level]=by[w.level]||[]).push(w.hz+'|'+w.py+'|'+w.mean);});
      for(const lv in by){add[lv]=(add[lv]?add[lv]+'\n':'')+by[lv].join('\n');notes.push('HSK '+lvName(+lv)+': '+by[lv].length+' words');}
      if(!p.rows.length)notes.push(f.name+': no usable lines');
    }
  }
  if(!Object.keys(add).length){toast(notes[0]||'Nothing to import');return;}
  const next={...USER,...add};
  try{localStorage.setItem(LKEY,JSON.stringify(next));}
  catch(e){toast('Not enough browser storage for these lists');return;}
  alert('Imported:\n'+notes.join('\n')+'\n\nThe app will reload.');
  location.reload();
}

const ACT={
  set(el){store.set[el.dataset.n]=el.dataset.v;save();render();},
  lvl(el){
    const n=+el.dataset.v,L=sel().slice(),i=L.indexOf(n);
    if(i>=0){if(L.length>1)L.splice(i,1);}else L.push(n);
    store.set.levels=L.sort((a,b)=>a-b);save();render();
  },
  lvall(){store.set.levels=LV.slice();save();render();},
  start(){startSession(false);},
  cram(){startSession(true);},
  browse(){setView('browse');},
  home(){setView('home');},
  quit(){save();setView('home');},
  again(){if(!buildQueue(sess.cram).length){setView('home');toast('Nothing else is due');}else startSession(sess.cram);},
  flip(){const c=cur();if(c&&c.phase==='q'){c.phase='a';render();}},
  rate(el){rate(+el.dataset.q);},
  choose(el){choose(+el.dataset.i);},
  giveup(){giveUp();},
  next(){const c=cur();if(c&&c.phase==='a')advance();},
  speak(el){speak(el.dataset.t);},
  open(el){const it=ITEM.get(el.dataset.k);if(it)showDlg(it);},
  closedlg(){$('#dlg').close();},
  known(el){const k=el.dataset.k,s=store.srs[k]||{r:0,l:0};s.b=5;s.due=Date.now()+STEPS[5];store.srs[k]=s;save();showDlg(ITEM.get(k));if(view!=='session')render();},
  reset1(el){const k=el.dataset.k;delete store.srs[k];save();showDlg(ITEM.get(k));if(view!=='session')render();},
  fnew(){fileNew();},
  fopen(){fileOpen();},
  funlink(){fileUnlink();},
  freconnect(){fileReconnect();},
  export(){
    const b=new Blob([JSON.stringify(store)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='hanzi-drill-progress.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },
  import(){$('#file').click();},
  addwords(){$('#wfile').click();},
  clearwords(){if(confirm('Remove the word lists you imported and go back to the ones included with the app? (Your progress is kept.)')){try{localStorage.removeItem(LKEY);}catch(e){}location.reload();}},
  wipe(){if(confirm('Erase all progress on this device?')){store.srs={};store.log={};save();render();toast('Progress reset');}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el,e);});
document.addEventListener('toggle',e=>{if(e.target.hasAttribute&&e.target.hasAttribute('data-det'))setOpen=e.target.open;},true);
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){bq=t.value;$('#brlist').innerHTML=browseRows();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sel){store.set[t.dataset.sel]=+t.value;save();render();}
  else if(t.dataset.chk){store.set[t.dataset.chk]=t.checked;save();render();}
  else if(t.id==='bs'){bs=t.value;$('#brlist').innerHTML=browseRows();}
  else if(t.id==='bl'){bl=t.value;$('#brlist').innerHTML=browseRows();}
  else if(t.id==='file'){
    const f=t.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{try{const s=JSON.parse(r.result);if(!valid(s))throw 0;adopt(s);store.t=Date.now();save();render();toast('Progress imported');}catch(x){toast('That isn’t a Hanzi Drill backup file');}};
    r.readAsText(f);
  }else if(t.id==='wfile'){
    importLists([...t.files]);t.value='';
  }
});
document.addEventListener('submit',e=>{if(e.target.dataset.form==='check'){e.preventDefault();check();}});
$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))$('#dlg').close();});
document.addEventListener('keydown',e=>{
  if(view!=='session'||!sess||e.ctrlKey||e.metaKey||e.altKey||e.repeat||$('#dlg').open)return;
  const c=cur(),m=store.set.method,k=e.key,num=k.length===1&&'1234'.includes(k);
  if(m==='flip'){
    if(c.phase==='q'&&(k===' '||k==='Enter')){e.preventDefault();ACT.flip();}
    else if(c.phase==='a'){if(num)rate(+k-1);else if(k===' '||k==='Enter'){e.preventDefault();rate(2);}}
  }else if(m==='type'){
    if(c.phase==='a'&&(k==='Enter'||k===' ')){e.preventDefault();advance();}
  }else{
    if(c.phase==='q'&&num&&c.q.opts[+k-1]!==undefined)choose(+k-1);
    else if(c.phase==='a'&&(k==='Enter'||k===' ')){e.preventDefault();advance();}
  }
});
const flush=()=>{try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}writeNow();};
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();});
render();
initFile();
})();
</script>
</body>
</html>
